# Ejecuta los tests en cada pull request y en cada push a main.
# Así ves un ✅ o un ❌ en el PR antes de fusionarlo, no después en Franc.
# Recuerda: go test ./... también valida el contenido (lecciones y SVG).
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read            # solo necesita leer el repo

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...     # avisa de errores típicos que compilan pero están mal
      - run: go test ./...
