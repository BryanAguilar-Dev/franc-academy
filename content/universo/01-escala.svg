<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="t">
  <title id="t">Distancias medidas en tiempo de viaje de la luz</title>
  <style>
    .bg{fill:#f6f8fc}.ink{fill:#16202e}.mut{fill:#586374}.bar{fill:#2652d4}.lin{stroke:#dbe1ea}
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    @media (prefers-color-scheme:dark){.bg{fill:#161d28}.ink{fill:#e5eaf1}.mut{fill:#98a3b4}.bar{fill:#85a2ff}.lin{stroke:#273244}}
  </style>
  <rect class="bg" width="640" height="330" rx="14"/>
  <text class="mut" x="24" y="34" font-size="13">Lo que tarda la luz en llegar desde…</text>
  <g font-size="15">
    <line class="lin" x1="24" y1="62" x2="616" y2="62"/>
    <rect class="bar" x="230" y="72" width="14" height="30" rx="4"/>
    <text class="ink" x="24" y="93" font-weight="600">La Luna</text><text class="mut" x="258" y="93">1,3 segundos</text>

    <rect class="bar" x="230" y="122" width="60" height="30" rx="4"/>
    <text class="ink" x="24" y="143" font-weight="600">El Sol</text><text class="mut" x="304" y="143">8 minutos</text>

    <rect class="bar" x="230" y="172" width="140" height="30" rx="4"/>
    <text class="ink" x="24" y="193" font-weight="600">Próxima Centauri</text><text class="mut" x="384" y="193">4,2 años</text>

    <rect class="bar" x="230" y="222" width="240" height="30" rx="4"/>
    <text class="ink" x="24" y="243" font-weight="600">Centro de la galaxia</text><text class="mut" x="484" y="243">26.000 años</text>

    <rect class="bar" x="230" y="272" width="300" height="30" rx="4"/>
    <text class="ink" x="24" y="293" font-weight="600">Andrómeda</text><text class="mut" x="544" y="293">2,5 millones</text>
  </g>
  <text class="mut" x="24" y="322" font-size="11">Barras en escala logarítmica: cada paso es miles de veces mayor que el anterior.</text>
</svg>
