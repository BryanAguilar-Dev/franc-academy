<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="t">
  <title id="t">Distancias medidas en tiempo de viaje de la luz</title>
  <style>
    .bg{fill:#f6f8fc}.ink{fill:#16202e}.mut{fill:#586374}.bar{fill:#2652d4}.trk{fill:#e6eaf1}
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    @media (prefers-color-scheme:dark){.bg{fill:#161d28}.ink{fill:#e5eaf1}.mut{fill:#98a3b4}.bar{fill:#85a2ff}.trk{fill:#222c3b}}
  </style>
  <rect class="bg" width="360" height="400" rx="14"/>
  <text class="mut" x="20" y="36" font-size="15">Lo que tarda la luz en llegar desde…</text>

  <g font-size="16">
    <text class="ink" x="20" y="78" font-weight="600">La Luna</text>
    <text class="mut" x="340" y="78" text-anchor="end">1,3 segundos</text>
    <rect class="trk" x="20" y="88" width="320" height="14" rx="7"/>
    <rect class="bar" x="20" y="88" width="8" height="14" rx="4"/>

    <text class="ink" x="20" y="138" font-weight="600">El Sol</text>
    <text class="mut" x="340" y="138" text-anchor="end">8 minutos</text>
    <rect class="trk" x="20" y="148" width="320" height="14" rx="7"/>
    <rect class="bar" x="20" y="148" width="62" height="14" rx="7"/>

    <text class="ink" x="20" y="198" font-weight="600">Próxima Centauri</text>
    <text class="mut" x="340" y="198" text-anchor="end">4,2 años</text>
    <rect class="trk" x="20" y="208" width="320" height="14" rx="7"/>
    <rect class="bar" x="20" y="208" width="187" height="14" rx="7"/>

    <text class="ink" x="20" y="258" font-weight="600">Centro de la galaxia</text>
    <text class="mut" x="340" y="258" text-anchor="end">26.000 años</text>
    <rect class="trk" x="20" y="268" width="320" height="14" rx="7"/>
    <rect class="bar" x="20" y="268" width="274" height="14" rx="7"/>

    <text class="ink" x="20" y="318" font-weight="600">Andrómeda</text>
    <text class="mut" x="340" y="318" text-anchor="end">2,5 millones de años</text>
    <rect class="trk" x="20" y="328" width="320" height="14" rx="7"/>
    <rect class="bar" x="20" y="328" width="320" height="14" rx="7"/>
  </g>

  <text class="mut" x="20" y="370" font-size="13">Escala logarítmica: cada trozo igual de barra</text>
  <text class="mut" x="20" y="388" font-size="13">multiplica el tiempo por 10, no le suma.</text>
</svg>
