<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" role="img" aria-labelledby="t">
  <title id="t">Ciclo de vida de las estrellas según su masa</title>
  <style>
    .bg{fill:#f6f8fc}.ink{fill:#16202e}.mut{fill:#586374}.box{fill:#ffffff;stroke:#dbe1ea}.lin{stroke:#586374;fill:none}.sep{stroke:#dbe1ea}
    .sun{fill:#f2b84b}.red{fill:#d9573b}.blu{fill:#4a74e0}.wd{fill:#cfd8e6;stroke:#586374}
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    @media (prefers-color-scheme:dark){.bg{fill:#161d28}.ink{fill:#e5eaf1}.mut{fill:#98a3b4}.box{fill:#1d2633;stroke:#273244}.lin{stroke:#98a3b4}.sep{stroke:#273244}.wd{fill:#e5eaf1;stroke:#98a3b4}}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="mut"/></marker></defs>
  <rect class="bg" width="360" height="600" rx="14"/>

  <g text-anchor="middle">
    <!-- Origen común -->
    <ellipse class="box" cx="180" cy="54" rx="78" ry="32"/>
    <text class="ink" x="180" y="50" font-size="15" font-weight="600">Nube de</text>
    <text class="ink" x="180" y="68" font-size="15" font-weight="600">gas y polvo</text>
    <path class="lin" d="M140 82 C110 100 95 110 95 128" marker-end="url(#a)"/>
    <path class="lin" d="M220 82 C250 100 265 110 265 128" marker-end="url(#a)"/>

    <line class="sep" x1="180" y1="140" x2="180" y2="580" stroke-dasharray="4 4"/>

    <!-- Cabeceras de columna -->
    <text class="mut" x="95" y="152" font-size="14">Masa como</text>
    <text class="mut" x="95" y="169" font-size="14">el Sol</text>
    <text class="mut" x="265" y="152" font-size="14">Más de ~8</text>
    <text class="mut" x="265" y="169" font-size="14">masas solares</text>

    <!-- 1. Estrella -->
    <circle class="sun" cx="95" cy="204" r="14"/>
    <text class="ink" x="95" y="240" font-size="15">Estrella</text>
    <circle class="blu" cx="265" cy="204" r="18"/>
    <text class="ink" x="265" y="240" font-size="15">Estrella masiva</text>
    <path class="lin" d="M95 250 V272" marker-end="url(#a)"/>
    <path class="lin" d="M265 250 V272" marker-end="url(#a)"/>

    <!-- 2. Gigante -->
    <circle class="red" cx="95" cy="306" r="26"/>
    <text class="ink" x="95" y="356" font-size="15">Gigante roja</text>
    <circle class="red" cx="265" cy="306" r="32"/>
    <text class="ink" x="265" y="356" font-size="15">Supergigante</text>
    <path class="lin" d="M95 366 V388" marker-end="url(#a)"/>
    <path class="lin" d="M265 366 V388" marker-end="url(#a)"/>

    <!-- 3. Final violento o suave -->
    <circle class="lin" cx="95" cy="416" r="20" stroke-dasharray="4 3"/>
    <circle class="wd" cx="95" cy="416" r="5"/>
    <text class="ink" x="95" y="456" font-size="15">Nebulosa</text>
    <text class="ink" x="95" y="474" font-size="15">planetaria</text>
    <polygon class="sun" points="265,392 272,410 291,410 276,422 282,440 265,429 248,440 254,422 239,410 258,410"/>
    <text class="ink" x="265" y="466" font-size="15">Supernova</text>
    <path class="lin" d="M95 484 V506" marker-end="url(#a)"/>
    <path class="lin" d="M250 476 L232 504" marker-end="url(#a)"/>
    <path class="lin" d="M280 476 L298 504" marker-end="url(#a)"/>

    <!-- 4. Restos -->
    <circle class="wd" cx="95" cy="526" r="7"/>
    <text class="ink" x="95" y="558" font-size="15">Enana blanca</text>
    <circle class="wd" cx="225" cy="526" r="5"/>
    <text class="ink" x="225" y="558" font-size="14">Estrella de</text>
    <text class="ink" x="225" y="575" font-size="14">neutrones</text>
    <text class="mut" x="265" y="531" font-size="14">o</text>
    <circle cx="305" cy="526" r="10" fill="#0b0f16" stroke="#d9573b" stroke-width="2"/>
    <text class="ink" x="305" y="558" font-size="14">Agujero</text>
    <text class="ink" x="305" y="575" font-size="14">negro</text>
  </g>
</svg>
