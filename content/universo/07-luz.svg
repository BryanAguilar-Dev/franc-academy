<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="t">
  <title id="t">La luz del Sol abierta en colores y las rayas del hidrógeno en absorción y en emisión</title>
  <!-- Eje de las franjas: x = 30 + (longitud de onda en nm − 400), de 400 a 700 nm.
       Rayas del hidrógeno (serie de Balmer): 410, 434, 486 y 656 nm. -->
  <defs>
    <linearGradient id="arco" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7a3cff"/>
      <stop offset="0.17" stop-color="#2b6cff"/>
      <stop offset="0.3" stop-color="#1fc6e0"/>
      <stop offset="0.43" stop-color="#3fcf4a"/>
      <stop offset="0.6" stop-color="#f2e33a"/>
      <stop offset="0.7" stop-color="#ff9a2e"/>
      <stop offset="0.87" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#b3121b"/>
    </linearGradient>
  </defs>
  <style>
    .bg{fill:#f6f8fc}.ink{fill:#16202e}.mut{fill:#586374}
    .sun{fill:#f2c230}.beam{stroke:#8a94a6;stroke-width:4}
    .prism{fill:#dce6f5;stroke:#7d8aa0;stroke-width:1.5}
    .abs{fill:#10131a}.night{fill:#0b0e14}
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    @media (prefers-color-scheme:dark){.bg{fill:#161d28}.ink{fill:#e5eaf1}.mut{fill:#98a3b4}.beam{stroke:#e5eaf1}.prism{fill:#2a3546;stroke:#98a3b4}.night{fill:#05070b}}
  </style>
  <rect class="bg" width="360" height="560" rx="14"/>

  <!-- 1. El prisma -->
  <text class="ink" x="20" y="40" font-size="15" font-weight="600">La luz blanca se abre en colores</text>
  <line class="beam" x1="72" y1="110" x2="166" y2="110"/>
  <circle class="sun" cx="50" cy="110" r="22"/>
  <polygon class="prism" points="140,145 185,70 230,145"/>
  <g stroke-width="3">
    <line x1="204" y1="108" x2="330" y2="80" stroke="#b3121b"/>
    <line x1="204" y1="109" x2="330" y2="89" stroke="#ff3b30"/>
    <line x1="204" y1="110" x2="330" y2="98" stroke="#ff9a2e"/>
    <line x1="204" y1="111" x2="330" y2="107" stroke="#f2e33a"/>
    <line x1="204" y1="112" x2="330" y2="116" stroke="#3fcf4a"/>
    <line x1="204" y1="113" x2="330" y2="125" stroke="#1fc6e0"/>
    <line x1="204" y1="114" x2="330" y2="134" stroke="#2b6cff"/>
    <line x1="204" y1="115" x2="330" y2="143" stroke="#7a3cff"/>
  </g>
  <text class="mut" x="50" y="156" font-size="13" text-anchor="middle">Sol</text>
  <text class="mut" x="185" y="164" font-size="13" text-anchor="middle">Prisma</text>

  <!-- 2. Espectro continuo -->
  <text class="ink" x="20" y="200" font-size="15" font-weight="600">Espectro continuo</text>
  <text class="mut" x="20" y="218" font-size="13">Todos los colores, sin cortes</text>
  <rect x="30" y="228" width="300" height="34" rx="3" fill="url(#arco)"/>

  <!-- 3. Absorción -->
  <text class="ink" x="20" y="300" font-size="15" font-weight="600">Absorción</text>
  <text class="mut" x="20" y="318" font-size="13">Un gas frío se queda con algunos colores</text>
  <rect x="30" y="328" width="300" height="34" rx="3" fill="url(#arco)"/>
  <rect class="abs" x="38.5" y="328" width="3" height="34"/>
  <rect class="abs" x="62.5" y="328" width="3" height="34"/>
  <rect class="abs" x="114.5" y="328" width="3" height="34"/>
  <rect class="abs" x="284.5" y="328" width="3" height="34"/>

  <!-- 4. Emisión -->
  <text class="ink" x="20" y="400" font-size="15" font-weight="600">Emisión</text>
  <text class="mut" x="20" y="418" font-size="13">Un gas caliente solo brilla en esos colores</text>
  <rect class="night" x="30" y="428" width="300" height="34" rx="3"/>
  <rect x="38.5" y="428" width="3" height="34" fill="#8a4dff"/>
  <rect x="62.5" y="428" width="3" height="34" fill="#4f6bff"/>
  <rect x="114.5" y="428" width="3" height="34" fill="#33c9e6"/>
  <rect x="284.5" y="428" width="3" height="34" fill="#ff3b30"/>
  <text class="mut" x="30" y="482" font-size="13">← violeta</text>
  <text class="mut" x="330" y="482" font-size="13" text-anchor="end">rojo →</text>

  <text class="ink" x="180" y="520" font-size="15" font-weight="600" text-anchor="middle">Mismas posiciones:</text>
  <text class="ink" x="180" y="540" font-size="15" text-anchor="middle">es la huella del hidrógeno</text>
</svg>
